services:
  - type: web
    name: dataprotect-senegal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    disk:
      name: dataprotect-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        sync: false
      - key: COHERE_API_KEY
        sync: false
